<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="grid-container">

    <div class="navbar">
      <h1>My Portfolio</h1>
      <div class="menu-toggle">&#9776;</div> <!-- Hamburger icon -->
    </div>

    <div class="sidebar">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact<br>us</a></li>
      </ul>
    </div>

    <div class="image-section">
      <img src="joaquin.jpeg.jfif" alt="Profile Photo">
    </div>

    <div class="text-section">
      <h2>hey! I'm Joaquin Andrew Agala</h2>
      <p>"I am an IT student focused on learning, innovating, and developing skills that bridge technology and people."</p>
    </div>

    <div class="footer"></div>

  </div>

  <!-- JavaScript for menu toggle -->
  <script>
    const toggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');

    toggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });
  </script>

</body>
</html>
